<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комбинаторика – два интерактивни урока</title>
    
    <!-- Зареждане на TailwindCSS за стиловете -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Зареждане на React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Обемни 3D изображения вместо емоджи (трябва да е след React и преди урока) -->
    <script src="../assets/emoji3d.js"></script>
    
    <!-- Зареждане на Babel за компилиране на JSX в браузъра -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Зареждане на KaTeX за математически формули като в учебник -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 70% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes simulationPulse {
            0% { transform: scale(.78); opacity: .35; }
            55% { transform: scale(1.14); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .simulation-step { animation: simulationPulse .55s cubic-bezier(.2,.9,.2,1) both; }
        @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
        .animate-bump { display: inline-block; animation: bump 0.35s ease-out; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        @media (prefers-reduced-motion: reduce) { .animate-bump, .animate-shake { animation: none !important; } }
        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in, .animate-slide-up, .animate-pop-in, .simulation-step { animation-duration: .01ms !important; }
        }
        button, .global-home {
            box-shadow: 0 5px 0 rgba(15, 23, 42, .24), 0 10px 20px rgba(15, 23, 42, .14) !important;
            translate: 0 0;
            transition: translate .14s ease, box-shadow .14s ease, filter .14s ease, background-color .14s ease !important;
        }
        button:not(:disabled):hover, .global-home:hover { translate: 0 -2px; filter: brightness(1.035); }
        button:not(:disabled):active, .global-home:active {
            translate: 0 4px;
            box-shadow: 0 1px 0 rgba(15, 23, 42, .28), 0 4px 8px rgba(15, 23, 42, .12) !important;
        }
        button:disabled { box-shadow: 0 3px 0 rgba(148, 163, 184, .26) !important; }
        .global-home {
            position: fixed; left: 14px; top: 14px; z-index: 2147483647;
            padding: 10px 15px; border-radius: 999px; background: rgba(15, 23, 42, .94);
            color: #fff; text-decoration: none; font: 800 14px/1.2 system-ui, sans-serif;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 selection:bg-blue-200">
    <a href="../index.html" aria-label="Към началната страница" class="global-home">⌂ Начало</a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- КОМПОНЕНТ ЗА МАТЕМАТИЧЕСКИ ФОРМУЛИ ---
        const MathFormula = ({ tex, display = false }) => {
            const html = katex.renderToString(tex, { 
                throwOnError: false, 
                displayMode: display 
            });
            return <span dangerouslySetInnerHTML={{ __html: html }} className={display ? "my-2 block" : ""} />;
        };

        // --- ИКОНИ (Вградени) ---
        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const ArrowRight = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        );
        const RefreshCw = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        );
        const Trophy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        );

        const useTimedAnimation = () => {
          const timers = useRef([]);
          const clearAnimation = () => {
            timers.current.forEach(timer => clearTimeout(timer));
            timers.current = [];
          };
          const schedule = (action, delay) => {
            const timer = setTimeout(action, delay);
            timers.current.push(timer);
          };
          useEffect(() => clearAnimation, []);
          return { schedule, clearAnimation };
        };

        const SimulationControls = ({ onPlay, onReset, isAnimating, label = 'Анимирай примера' }) => (
          <div className="flex flex-wrap gap-3 mt-4">
            <button onClick={onPlay} disabled={isAnimating}
              className={`rounded-xl px-5 py-3 font-extrabold text-white ${isAnimating ? 'bg-slate-400 cursor-wait' : 'bg-orange-500 hover:bg-orange-600'}`}>
              {isAnimating ? '▶ Анимацията се изпълнява…' : `▶ ${label}`}
            </button>
            <button onClick={onReset}
              className="rounded-xl px-5 py-3 font-extrabold bg-white text-slate-700 border border-slate-300 inline-flex items-center gap-2">
              <RefreshCw size={18} /> Нулирай
            </button>
          </div>
        );

        const useSelectionAnimation = (allItems, needed, setAvailableItems, setCurrentSelection) => {
          const [isAnimating, setIsAnimating] = useState(false);
          const { schedule, clearAnimation } = useTimedAnimation();
          const resetAnimatedSelection = () => {
            clearAnimation();
            setIsAnimating(false);
            setCurrentSelection([]);
            setAvailableItems(allItems);
          };
          const animateSelection = () => {
            resetAnimatedSelection();
            setIsAnimating(true);
            allItems.slice(0, needed).forEach((item, index) => schedule(() => {
              const chosen = allItems.slice(0, index + 1);
              setCurrentSelection(chosen);
              setAvailableItems(allItems.filter(value => !chosen.includes(value)));
            }, index * 700));
            schedule(() => setIsAnimating(false), needed * 700 + 150);
          };
          return { isAnimating, animateSelection, resetAnimatedSelection };
        };

        // --- ЛОГА И НАЧАЛНА ИЛЮСТРАЦИЯ ---
        const LargeLogo = () => (
          <div className="absolute bottom-5 right-5 md:bottom-7 md:right-7 z-20 animate-fade-in opacity-75">
            <img src="../assets/brand-mark.png" alt="Знак на автора" className="h-12 sm:h-14 w-auto object-contain" />
          </div>
        );

        const SmallLogo = () => (
          <img
            src="../assets/brand-mark.png"
            alt="Знак на автора"
            className="fixed bottom-4 right-4 z-40 h-12 sm:h-14 w-auto opacity-70 drop-shadow-md"
          />
        );

        const HeroIllustration = () => (
          <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-950 via-blue-800 to-cyan-600 shadow-2xl border border-white/20">
            <svg viewBox="0 0 1200 430" className="w-full h-auto block" role="img" aria-label="Комбинаторика – подреждане, избор и групиране">
              <defs>
                <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#ffffff" stopOpacity="0.32" />
                  <stop offset="100%" stopColor="#ffffff" stopOpacity="0.05" />
                </linearGradient>
                <filter id="softShadow">
                  <feDropShadow dx="0" dy="10" stdDeviation="12" floodOpacity="0.24" />
                </filter>
              </defs>
              <circle cx="1050" cy="70" r="150" fill="#ffffff" opacity="0.08" />
              <circle cx="90" cy="370" r="170" fill="#67e8f9" opacity="0.10" />
              <path d="M0 330 C250 245 410 430 650 315 C850 220 1000 300 1200 215 L1200 430 L0 430 Z" fill="#ffffff" opacity="0.07" />

              <g filter="url(#softShadow)">
                <rect x="90" y="75" width="265" height="265" rx="34" fill="url(#heroGlow)" stroke="#ffffff" strokeOpacity="0.35" />
                <text x="222" y="125" textAnchor="middle" fill="#ffffff" fontSize="25" fontWeight="700">ПОДРЕЖДАМЕ</text>
                <g fontSize="70">
                  <text x="125" y="225">🍎</text><text x="205" y="225">🍓</text><text x="285" y="225">🍇</text>
                </g>
                <path d="M135 270 H310" stroke="#a5f3fc" strokeWidth="8" strokeLinecap="round" />
                <path d="M280 250 L315 270 L280 290" fill="none" stroke="#a5f3fc" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
              </g>

              <g filter="url(#softShadow)">
                <rect x="465" y="75" width="265" height="265" rx="34" fill="url(#heroGlow)" stroke="#ffffff" strokeOpacity="0.35" />
                <text x="597" y="125" textAnchor="middle" fill="#ffffff" fontSize="25" fontWeight="700">ИЗБИРАМЕ И РЕДИМ</text>
                <g fontSize="66">
                  <text x="500" y="220">🚗</text><text x="575" y="220">🚕</text><text x="650" y="220">🚙</text>
                </g>
                <rect x="505" y="265" width="75" height="48" rx="10" fill="#ffffff" opacity="0.92" />
                <rect x="615" y="265" width="75" height="48" rx="10" fill="#ffffff" opacity="0.92" />
                <text x="543" y="298" textAnchor="middle" fill="#1e3a8a" fontSize="23" fontWeight="800">1</text>
                <text x="653" y="298" textAnchor="middle" fill="#1e3a8a" fontSize="23" fontWeight="800">2</text>
              </g>

              <g filter="url(#softShadow)">
                <rect x="840" y="75" width="265" height="265" rx="34" fill="url(#heroGlow)" stroke="#ffffff" strokeOpacity="0.35" />
                <text x="972" y="125" textAnchor="middle" fill="#ffffff" fontSize="25" fontWeight="700">ИЗБИРАМЕ ГРУПА</text>
                <ellipse cx="972" cy="255" rx="95" ry="67" fill="#ffffff" opacity="0.92" />
                <g fontSize="66"><text x="900" y="278">⚽</text><text x="970" y="278">🏀</text></g>
                <text x="972" y="325" textAnchor="middle" fill="#ede9fe" fontSize="20" fontWeight="700">редът няма значение</text>
              </g>
            </svg>
          </div>
        );

        // --- КОМПОНЕНТ: НАЧАЛНА СТРАНИЦА (УИДЖЕТ) ---
        const HomePage = ({ onStart }) => {
          const shirts = ['👕', '👚', '🧥'];
          const pants = ['👖', '🩳'];
          const [selectedShirt, setSelectedShirt] = useState(null);
          const [selectedPants, setSelectedPants] = useState(null);
          const [outfits, setOutfits] = useState([]);
          const [isAnimating, setIsAnimating] = useState(false);
          const { schedule, clearAnimation } = useTimedAnimation();

          useEffect(() => {
            if (selectedShirt && selectedPants) {
              const outfitStr = selectedShirt + selectedPants;
              
              setOutfits(prevOutfits => {
                if (!prevOutfits.includes(outfitStr)) {
                  return [...prevOutfits, outfitStr];
                }
                return prevOutfits;
              });

              const timer = setTimeout(() => {
                setSelectedShirt(null);
                setSelectedPants(null);
              }, 600);
              
              return () => clearTimeout(timer);
            }
          }, [selectedShirt, selectedPants]);

          const resetOutfitSimulation = () => {
            clearAnimation();
            setIsAnimating(false);
            setSelectedShirt(null);
            setSelectedPants(null);
            setOutfits([]);
          };

          const animateOutfits = () => {
            resetOutfitSimulation();
            setIsAnimating(true);
            const examples = shirts.flatMap(shirt => pants.map(pant => ({ shirt, pant })));
            examples.forEach(({ shirt, pant }, index) => {
              schedule(() => {
                setSelectedShirt(shirt);
                setSelectedPants(pant);
                setOutfits(previous => {
                  const outfit = shirt + pant;
                  return previous.includes(outfit) ? previous : [...previous, outfit];
                });
              }, index * 750);
            });
            schedule(() => {
              setSelectedShirt(null);
              setSelectedPants(null);
              setIsAnimating(false);
            }, examples.length * 750);
          };

          return (
            <div className="min-h-screen px-4 py-6 md:py-10 animate-fade-in">
              <div className="max-w-6xl mx-auto relative pb-32 md:pb-36">
                <HeroIllustration />

                <section className="bg-white -mt-5 md:-mt-8 relative z-10 mx-2 md:mx-8 p-6 md:p-9 rounded-3xl shadow-xl border border-gray-100 text-center">
                  <span className="inline-flex items-center rounded-full bg-blue-100 text-blue-800 px-4 py-1.5 text-sm font-bold mb-4">
                    Два интерактивни урока за 8. клас
                  </span>
                  <h1 className="text-3xl md:text-5xl font-extrabold text-blue-950 mb-4 tracking-tight">
                    Комбинаторика
                  </h1>
                  <p className="text-gray-600 mb-5 text-lg md:text-xl leading-relaxed max-w-4xl mx-auto">
                    Избери един от двата свързани урока. Първият изгражда основните правила за броене,
                    а вторият ги прилага при пермутации, вариации и комбинации.
                  </p>
                  <div className="grid md:grid-cols-2 gap-4 max-w-5xl mx-auto mb-8 text-left">
                    <article className="rounded-3xl bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 p-6">
                      <span className="inline-flex rounded-full bg-amber-200 text-amber-900 px-3 py-1 text-xs font-black mb-3">УРОК 1</span>
                      <h2 className="text-2xl font-extrabold text-amber-900 mb-2">Събиране и умножение на възможности</h2>
                      <p className="text-gray-600 mb-5">Разпознаваме „ИЛИ“ и „И“, моделираме изборите и решаваме две интерактивни предизвикателства.</p>
                      <button onClick={() => onStart('rules')} className="w-full rounded-xl bg-amber-500 hover:bg-amber-600 text-white px-5 py-3 font-extrabold">
                        Започни урок 1
                      </button>
                    </article>
                    <article className="rounded-3xl bg-gradient-to-br from-blue-50 to-purple-50 border border-blue-200 p-6">
                      <span className="inline-flex rounded-full bg-blue-200 text-blue-900 px-3 py-1 text-xs font-black mb-3">УРОК 2</span>
                      <h2 className="text-2xl font-extrabold text-blue-950 mb-2">Пермутации, вариации и комбинации</h2>
                      <p className="text-gray-600 mb-5">Подреждаме всички елементи, избираме и подреждаме част от тях или съставяме група.</p>
                      <button onClick={() => onStart('models')} className="w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 font-extrabold">
                        Започни урок 2
                      </button>
                    </article>
                  </div>

                  <div className="bg-blue-50 p-6 rounded-2xl mb-8 relative overflow-hidden max-w-3xl mx-auto">

                  <div className="absolute top-0 right-0 p-4 opacity-10">
                    <Trophy size={100} />
                  </div>
                  <h3 className="font-bold text-xl text-blue-800 mb-4">Опитай пример от урок 1: Създай тоалет</h3>
                  <p className="text-sm text-blue-600 mb-4">
                    Разполагаш с 3 горни дрехи и 2 долни. Избери по една от всяка, за да създадеш тоалет. 
                    Колко различни тоалета можеш да направиш?
                  </p>

                  <div className="flex flex-col md:flex-row gap-6 justify-center items-center mb-6 z-10 relative">
                    <div className="flex gap-2 bg-white p-3 rounded-xl shadow-sm">
                      {shirts.map(shirt => (
                        <button 
                          key={shirt} 
                          disabled={isAnimating}
                          onClick={() => setSelectedShirt(shirt)}
                          aria-label={`Избери горна дреха ${shirt}`}
                          className={`text-4xl p-2 rounded-lg transition-all ${selectedShirt === shirt ? 'bg-blue-200 scale-110' : 'hover:bg-gray-100'}`}
                        >
                          {shirt}
                        </button>
                      ))}
                    </div>
                    <span className="text-2xl font-bold text-blue-300">+</span>
                    <div className="flex gap-2 bg-white p-3 rounded-xl shadow-sm">
                      {pants.map(pant => (
                        <button 
                          key={pant} 
                          disabled={isAnimating}
                          onClick={() => setSelectedPants(pant)}
                          aria-label={`Избери долна дреха ${pant}`}
                          className={`text-4xl p-2 rounded-lg transition-all ${selectedPants === pant ? 'bg-blue-200 scale-110' : 'hover:bg-gray-100'}`}
                        >
                          {pant}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex justify-center mb-6">
                    <SimulationControls onPlay={animateOutfits} onReset={resetOutfitSimulation}
                      isAnimating={isAnimating} label="Покажи всичките 6 тоалета" />
                  </div>

                  <div className="bg-white/60 p-4 rounded-xl text-left border border-white">
                    <div className="text-sm font-bold text-blue-800 mb-2">
                      Открити комбинации: {outfits.length} / 6
                    </div>
                    <div className="flex flex-wrap gap-2 min-h-[48px]">
                      {outfits.map((outfit, idx) => (
                        <div key={idx} className="bg-white px-3 py-1 rounded-full shadow-sm text-2xl animate-pop-in">
                          {outfit}
                        </div>
                      ))}
                      {outfits.length === 0 && <span className="text-gray-400 italic flex items-center h-full">Все още няма избрани...</span>}
                    </div>
                  </div>
                  
                  {outfits.length === 6 && (
                    <div className="mt-4 text-green-600 font-bold animate-bounce text-lg bg-green-100 p-2 rounded-lg">
                      Точно така! <MathFormula tex="3 \cdot 2 = 6" />. Това е основното правило за умножение!
                    </div>
                  )}
                </div>

                </section>

                <LargeLogo />
              </div>
            </div>
          );
        };

        // --- АВТОМАТИЧНО ПОДРЕЖДАНЕ: ОБЩИ ПОМОЩНИЦИ ---
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const prefersReducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Прелита емоджи от елемента fromEl до елемента toEl по дъга
        const flyEmoji = (fromEl, toEl, content, ms, hideSource = true) => new Promise(resolve => {
          if (!fromEl || !toEl || ms <= 0 || prefersReducedMotion()) { resolve(); return; }
          const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
          const el = document.createElement('div');
          if (window.Emoji3D) el.innerHTML = window.Emoji3D.html(content); else el.textContent = content;
          Object.assign(el.style, {
            position: 'fixed', left: `${a.left + a.width / 2}px`, top: `${a.top + a.height / 2}px`,
            fontSize: getComputedStyle(fromEl).fontSize, lineHeight: '1', zIndex: 9999, pointerEvents: 'none',
            filter: 'drop-shadow(0 10px 12px rgba(15,23,42,.28))'
          });
          document.body.appendChild(el);
          if (hideSource) fromEl.style.visibility = 'hidden';
          const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
          const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
          const lift = -Math.max(50, Math.abs(dx) * 0.25);
          const done = () => { el.remove(); resolve(); };
          if (el.animate) {
            const anim = el.animate([
              { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)' },
              { transform: `translate(calc(-50% + ${dx / 2}px), calc(-50% + ${dy / 2 + lift}px)) scale(1.35) rotate(-12deg)`, offset: 0.5 },
              { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(0deg)` }
            ], { duration: ms, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
            anim.onfinish = done; anim.oncancel = done;
          } else {
            setTimeout(done, ms);
          }
        });

        // Всички подредби/групи от k елемента
        const arrangementsOf = (items, k, ordered) => {
          const out = [];
          const rec = (pref, start) => {
            if (pref.length === k) { out.push(pref); return; }
            items.forEach((it, i) => {
              if (pref.includes(it)) return;
              if (!ordered && i < start) return;
              rec([...pref, it], i + 1);
            });
          };
          rec([], 0);
          return out;
        };

        const SPEEDS = [
          { id: 'slow', label: 'Бавно', ms: 1100 },
          { id: 'normal', label: 'Нормално', ms: 650 },
          { id: 'fast', label: 'Бързо', ms: 320 }
        ];

        const AutoControls = ({ title = 'Автоматично подреждане:', running, onRun, onStep, onPause, onClear, speed, setSpeed, disabled, solved, tone }) => {
          const tones = {
            blue: 'bg-blue-600 hover:bg-blue-700', emerald: 'bg-emerald-600 hover:bg-emerald-700', purple: 'bg-purple-600 hover:bg-purple-700'

              {!running ? (
                <>
                  <button onClick={onRun} disabled={disabled || solved} className={`px-4 py-2 rounded-full text-white font-bold disabled:bg-gray-300 ${tones[tone]}`}>▶ Подреди всички</button>
                  <button onClick={onStep} disabled={disabled || solved} className="px-4 py-2 rounded-full bg-white border border-slate-300 text-slate-700 font-bold disabled:text-gray-400">⏭ Една стъпка</button>

                {SPEEDS.map(sp => (
                  <button key={sp.id} onClick={() => setSpeed(sp.id)}
                    className={`px-3 py-1.5 rounded-full text-sm font-bold ${speed === sp.id ? 'bg-slate-800 text-white' : 'text-slate-600'}`}
                    style={{ boxShadow: 'none' }}>{sp.label}</button>

              </div>
              <button onClick={onClear} disabled={running || disabled} className="px-3 py-2 rounded-full bg-white border border-slate-300 text-slate-600 font-bold flex items-center gap-1 disabled:text-gray-400"><RefreshCw size={15} /> Изчисти</button>
            </div>
          );
        };

        const Stepper = ({ label, value, min, max, onChange, disabled, tone = 'teal' }) => {
          const tones = {
            teal: 'bg-teal-600 hover:bg-teal-700', amber: 'bg-amber-500 hover:bg-amber-600',
            blue: 'bg-blue-600 hover:bg-blue-700', cyan: 'bg-cyan-600 hover:bg-cyan-700', emerald: 'bg-emerald-600 hover:bg-emerald-700', indigo: 'bg-indigo-600 hover:bg-indigo-700', rose: 'bg-rose-500 hover:bg-rose-600'
          };
          const btn = `w-9 h-9 rounded-full text-white text-xl font-extrabold flex items-center justify-center ${tones[tone]} disabled:bg-gray-300 disabled:cursor-not-allowed`;
          return (
            <div className="flex items-center gap-2 bg-white rounded-full pl-4 pr-1.5 py-1.5 border border-gray-200">
              <span className="text-sm font-bold text-gray-600 mr-1">{label}</span>
              <button aria-label={`Намали ${label}`} className={btn} disabled={disabled || value <= min} onClick={() => onChange(value - 1)}>−</button>
              <span key={value} className="w-8 text-center text-xl font-extrabold text-gray-800 animate-bump">{value}</span>
              <button aria-label={`Увеличи ${label}`} className={btn} disabled={disabled || value >= max} onClick={() => onChange(value + 1)}>+</button>
            </div>

        const CountingRules = ({ onNext, onComplete }) => {
          const [checkedRule, setCheckedRule] = useState(null);
          const [challengeAnswers, setChallengeAnswers] = useState({ add: null, multiply: null });
          const [activeChallenge, setActiveChallenge] = useState('add');
          const [exploredAlternatives, setExploredAlternatives] = useState([]);
          const [selectedRoute, setSelectedRoute] = useState(null);
          const [selectedTransport, setSelectedTransport] = useState(null);
          const [travelPairs, setTravelPairs] = useState([]);
          const [isAnimating, setIsAnimating] = useState(null);

          // Променлив брой (по подразбиране като в оригиналната задача)
          const [theaterCount, setTheaterCount] = useState(7);
          const [choirCount, setChoirCount] = useState(5);
          const [routeCount, setRouteCount] = useState(3);
          const [transportCount, setTransportCount] = useState(2);
          const TRANSPORT_POOL = ['🚌', '🚆', '🚗', '🚲'];
          const TRANSPORT_NAMES = { '🚌': 'автобус', '🚆': 'влак', '🚗': 'кола', '🚲': 'велосипед' };
          const theaterIds = Array.from({ length: theaterCount }, (_, i) => `Т${i + 1}`);
          const choirIds = Array.from({ length: choirCount }, (_, i) => `Х${i + 1}`);
          const THEATER_FACES = ['👧', '👦🏻', '🧒🏽', '👩🏼', '👦🏾', '👧🏼', '🧑', '👩🏽', '👦', '🧒🏻'];
          const CHOIR_FACES = ['👦🏼', '👧🏽', '🧑🏻', '👧', '🧒', '👦🏽', '👩', '👧🏾', '🧑🏼', '👦🏻'];
          const theaterFaces = THEATER_FACES.slice(0, theaterCount);
          const choirFaces = CHOIR_FACES.slice(0, choirCount);
          const faceOf = (id) => (id[0] === 'Т' ? THEATER_FACES : CHOIR_FACES)[Number(id.slice(1)) - 1];
          const exploredT = exploredAlternatives.filter(x => x[0] === 'Т').length;
          const exploredX = exploredAlternatives.filter(x => x[0] === 'Х').length;
          const allAlternatives = [...theaterIds, ...choirIds];
          const routes = Array.from({ length: routeCount }, (_, i) => i + 1);
          const transports = TRANSPORT_POOL.slice(0, transportCount);
          const addAnswer = theaterCount + choirCount;
          const multiplyAnswer = routeCount * transportCount;
          // Верният отговор е първият в списъка; добавяме типичните грешки, после резервни числа
          const pickOptions = (main, spare) => {
            const out = [];
            [...main, ...spare].forEach(v => { if (v > 0 && !out.includes(v) && out.length < 3) out.push(v); });
            return out.sort((a, b) => a - b);
          };
          const addOptions = pickOptions([addAnswer, theaterCount * choirCount, 2], [addAnswer + 1, addAnswer + 2, addAnswer - 1]);
          const multiplyOptions = pickOptions([multiplyAnswer, routeCount + transportCount, multiplyAnswer + routeCount], [multiplyAnswer + 1, multiplyAnswer + 2, multiplyAnswer - 1]);

          const [addDone, setAddDone] = useState(false);
          const [multiplyDone, setMultiplyDone] = useState(false);
          const solvedChallenges = Number(addDone) + Number(multiplyDone);
          const addSolved = addDone;
          const multiplySolved = multiplyDone;
          const chooseChallengeAnswer = (challenge, answer) => {
            setChallengeAnswers(previous => ({ ...previous, [challenge]: answer }));
            if (challenge === 'add' && answer === addAnswer) setAddDone(true);
            if (challenge === 'multiply' && answer === multiplyAnswer) setMultiplyDone(true);
          };
          const toggleAlternative = (id) => {
            if (isAnimating) return;
            setExploredAlternatives(previous => previous.includes(id) ? previous.filter(item => item !== id) : [...previous, id]);
          };

          // --- Автоматична симулация с прелитане ---
          const rulesRootRef = useRef(null);
          const aliveRef = useRef(true);
          const stopRef = useRef(false);
          const exploredRef = useRef([]);
          const pairsRef = useRef([]);
          const [speed, setSpeed] = useState('normal');
          const speedRef = useRef('normal');
          useEffect(() => { speedRef.current = speed; }, [speed]);
          useEffect(() => { exploredRef.current = exploredAlternatives; }, [exploredAlternatives]);
          useEffect(() => { pairsRef.current = travelPairs; }, [travelPairs]);
          useEffect(() => () => { aliveRef.current = false; stopRef.current = true; }, []);
          const currentMs = () => SPEEDS.find(x => x.id === speedRef.current).ms;
          const q = (sel) => rulesRootRef.current && rulesRootRef.current.querySelector(sel);

          const resetAlternatives = () => {
            stopRef.current = true;
            setIsAnimating(null);
            exploredRef.current = [];
            setExploredAlternatives([]);
          };
          const animateAlternatives = async (continuous = true) => {
            stopRef.current = false;
            setIsAnimating('add');
            while (aliveRef.current) {
              const next = allAlternatives.find(id => !exploredRef.current.includes(id));
              if (!next) break;
              const ms = currentMs();
              await flyEmoji(q(`[data-alt="${next}"] .text-4xl`), q(`[data-altslot="${next}"]`), faceOf(next), ms * 0.9, false);
              if (!aliveRef.current) return;
              exploredRef.current = [...exploredRef.current, next];
              setExploredAlternatives(exploredRef.current);
              await sleep(ms * 0.25);
              if (!continuous || stopRef.current) break;
            }
            if (aliveRef.current) setIsAnimating(null);
          };

          const resetTravel = () => {
            stopRef.current = true;
            setIsAnimating(null);
            setSelectedRoute(null);
            setSelectedTransport(null);
            pairsRef.current = [];
            setTravelPairs([]);
          };
          const animateTravel = async (continuous = true) => {
            stopRef.current = false;
            setIsAnimating('multiply');
            const all = routes.flatMap(route => transports.map(transport => ({ route, transport })));
            while (aliveRef.current) {
              const next = all.find(p => !pairsRef.current.includes(`${p.route}-${p.transport}`));
              if (!next) break;
              const ms = currentMs();
              setSelectedTransport(null);
              setSelectedRoute(next.route);
              await sleep(ms * 0.45);
              if (!aliveRef.current) return;
              await flyEmoji(q(`[data-transport="${next.transport}"]`), q(`[data-pair="${next.route}-${next.transport}"]`), next.transport, ms, false);
              if (!aliveRef.current) return;
              setSelectedTransport(next.transport);
              pairsRef.current = [...pairsRef.current, `${next.route}-${next.transport}`];
              await sleep(ms * 0.35);
              if (!continuous || stopRef.current) break;
            }
            if (aliveRef.current) {
              setSelectedRoute(null);
              setSelectedTransport(null);
              setIsAnimating(null);
            }
          };

          useEffect(() => {
            if (!selectedRoute || !selectedTransport) return;
            const pair = `${selectedRoute}-${selectedTransport}`;
            setTravelPairs(previous => previous.includes(pair) ? previous : [...previous, pair]);
          }, [selectedRoute, selectedTransport]);

          // При смяна на броя започваме задачата отначало (напредъкът в урока се запазва)
          useEffect(() => { resetAlternatives(); setChallengeAnswers(prev => ({ ...prev, add: null })); }, [theaterCount, choirCount]);
          useEffect(() => { resetTravel(); setChallengeAnswers(prev => ({ ...prev, multiply: null })); }, [routeCount, transportCount]);

          useEffect(() => {
            if (solvedChallenges === 2) onComplete?.();
          }, [solvedChallenges, onComplete]);

          return (
            <div ref={rulesRootRef} className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-t-4 border-amber-500 animate-slide-up">

                    {solvedChallenges === 2 ? 'Събиране и умножение на възможности' : 'Открий двете основни правила'}

                    дали изборите са <strong>алтернативни</strong>, или се извършват <strong>последователно</strong>.
                  </p>
                </div>
                <div className="text-7xl" aria-hidden="true">🧭</div>
              </div>

                <div className="flex items-center justify-between gap-4 mb-2">
                  <strong className="text-slate-800">Напредък в урока</strong>
                  <span className="font-extrabold text-amber-700">{solvedChallenges} / 2 предизвикателства</span>
                </div>
                <div className="h-3 rounded-full bg-white overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-500" style={{width: `${solvedChallenges * 50}%`}}></div>
                </div>
              </div>

              <div className="grid sm:grid-cols-3 gap-3 mb-7">
                <button onClick={() => setActiveChallenge('add')}
                  className={`rounded-2xl px-4 py-4 font-extrabold flex items-center justify-center gap-2 ${activeChallenge === 'add' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-900 border border-blue-200'}`}>
                  {addSolved ? <CheckCircle size={19} /> : <span className="w-7 h-7 rounded-full bg-blue-100 text-blue-700 grid place-items-center text-sm">1</span>}
                  {addSolved ? 'Първо правило' : 'Предизвикателство'}
                </button>
                <button disabled={!addSolved} onClick={() => addSolved && setActiveChallenge('multiply')}
                  className={`rounded-2xl px-4 py-4 font-extrabold flex items-center justify-center gap-2 ${activeChallenge === 'multiply' ? 'bg-emerald-600 text-white shadow-md' : addSolved ? 'bg-white text-emerald-900 border border-emerald-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                  {multiplySolved ? <CheckCircle size={19} /> : <span className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 grid place-items-center text-sm">2</span>}
                  {multiplySolved ? 'Второ правило' : addSolved ? 'Предизвикателство' : 'Заключено'}
                </button>
                <button disabled={solvedChallenges < 2} onClick={() => solvedChallenges === 2 && setActiveChallenge('summary')}
                  className={`rounded-2xl px-4 py-4 font-extrabold flex items-center justify-center gap-2 ${activeChallenge === 'summary' ? 'bg-amber-500 text-white shadow-md' : solvedChallenges === 2 ? 'bg-white text-amber-900 border border-amber-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                  <span className="w-7 h-7 rounded-full bg-amber-100 text-amber-700 grid place-items-center text-sm">3</span>
                  {solvedChallenges === 2 ? 'Обобщение' : 'Заключено'}
                </button>
              </div>

              {activeChallenge === 'summary' && (
              <div className="grid lg:grid-cols-2 gap-6 animate-fade-in">
                <article className="rounded-3xl border border-blue-200 bg-gradient-to-br from-blue-50 to-cyan-50 p-6 shadow-sm">
                  <div className="flex items-center gap-3 mb-4">
                    <span className="w-12 h-12 rounded-2xl bg-blue-600 text-white grid place-items-center text-2xl font-black">+</span>
                    <div>
                      <h4 className="text-2xl font-extrabold text-blue-900">Правило за събиране</h4>
                      <p className="text-blue-700 font-bold">Ключова дума: „ИЛИ“</p>
                    </div>
                  </div>
                  <p className="text-gray-700 leading-relaxed mb-5">
                    Ако един избор може да се направи по <strong>m</strong> начина от група A
                    <strong> или</strong> по <strong>n</strong> начина от отделна група B, като двата случая не се припокриват,
                    общият брой възможности е:

                    <MathFormula tex="m+n" display={true} />
                  </div>

                    <p className="font-bold text-blue-900 mb-3">Пример: избираме един представител</p>
                    <div className="flex flex-wrap items-center justify-center gap-3 text-center">

                      <span className="text-2xl font-black text-blue-500">+</span>
                      <span className="rounded-xl bg-cyan-100 px-4 py-3"><strong>30</strong><br/><small>от 8.б клас</small></span>
                      <span className="text-2xl font-black text-blue-500">=</span>
                      <span className="rounded-xl bg-blue-700 text-white px-4 py-3"><strong>58</strong><br/><small>възможности</small></span>

                    <span className="w-12 h-12 rounded-2xl bg-emerald-600 text-white grid place-items-center text-2xl font-black">×</span>
                    <div>

                  <p className="text-gray-700 leading-relaxed mb-5">
                    Ако първата стъпка има <strong>m</strong> възможности и за всеки неин избор

                  <div className="rounded-2xl bg-white/80 border border-white p-4">

                      <span className="text-2xl font-black text-emerald-500">×</span>
                      <span className="rounded-xl bg-teal-100 px-4 py-3"><strong>2</strong><br/><small>долни дрехи</small></span>
                      <span className="text-2xl font-black text-emerald-500">=</span>
                      <span className="rounded-xl bg-emerald-700 text-white px-4 py-3"><strong>6</strong><br/><small>тоалета</small></span>
                    </div>
                  </div>
                </article>
              </div>
              )}

              <div className="mt-8 space-y-6">
                {activeChallenge === 'add' && (
                <section className="rounded-3xl border-t-4 border-blue-500 bg-blue-50 p-6 shadow-sm">
                  <div className="flex items-center gap-3 mb-3">
                    <span className="w-10 h-10 rounded-full bg-blue-600 text-white grid place-items-center font-black">1</span>
                    <h4 className="text-2xl font-extrabold text-blue-900">Предизвикателство: Избор на участник</h4>

                  <p className="text-gray-700 text-lg mb-4">

                    някой от <strong>{theaterCount}</strong> {theaterCount === 1 ? 'ученик' : 'ученици'} в театралната група <strong>или</strong> някой от <strong>{choirCount}</strong> {choirCount === 1 ? 'ученик' : 'ученици'} в хора.
                    По колко начина може да се направи изборът?
                  </p>
                  <div className="flex flex-wrap gap-3 mb-4">
                    <Stepper label="🎭 Театрална група" value={theaterCount} min={1} max={10} onChange={setTheaterCount} disabled={!!isAnimating} tone="rose" />
                    <Stepper label="🎵 Хор" value={choirCount} min={1} max={10} onChange={setChoirCount} disabled={!!isAnimating} tone="indigo" />
                  </div>

                    <div className="font-bold text-blue-900 mb-3">Симулация: натискай учениците, за да разгледаш възможните единични избори</div>

                    {/* Две отделни групи – сцена и хор */}
                    <div className="grid lg:grid-cols-[1fr_auto_1fr] gap-4 items-stretch">
                      <div className="relative rounded-2xl overflow-hidden border-2 border-rose-300 bg-gradient-to-b from-rose-900 via-rose-700 to-amber-600 p-4 pt-12 shadow-inner">
                        <div className="absolute inset-x-0 top-0 h-9 bg-[repeating-linear-gradient(90deg,#7f1d1d_0_18px,#991b1b_18px_36px)] rounded-b-[40%] shadow-lg" aria-hidden="true"></div>
                        <div className="absolute top-2 left-1/2 -translate-x-1/2 bg-amber-300 text-rose-900 font-black text-sm px-3 py-1 rounded-full shadow whitespace-nowrap">🎭 Театрална сцена · {theaterCount}</div>
                        <div className="flex flex-wrap justify-center gap-3 pt-2">
                          {theaterIds.map((id, i) => {
                            const on = exploredAlternatives.includes(id);
                            return (
                              <span key={id} className="inline-block animate-pop-in" style={{ animationDelay: `${i * 45}ms`, opacity: 0 }}>

                                  className={`relative flex flex-col items-center w-16 rounded-2xl pt-1.5 pb-1 transition-all duration-300 ${on ? 'bg-amber-200 ring-4 ring-amber-300 -translate-y-1' : 'bg-white/90 hover:-translate-y-1 hover:bg-white'}`}
                                  style={on ? { boxShadow: '0 0 22px 6px rgba(253,230,138,.75)' } : undefined}>
                                  <span className="text-4xl leading-none">{theaterFaces[i]}</span>
                                  <span className="text-[11px] font-extrabold text-rose-800 mt-0.5">{id}</span>
                                  <span className="absolute -top-2 -right-2 text-lg">🎭</span>
                                </button>
                              </span>
                            );
                          })}
                        </div>
                        <div className="h-3 mt-4 rounded-full bg-amber-900/40" aria-hidden="true"></div>
                      </div>

                      <div className="flex lg:flex-col items-center justify-center gap-2">
                        <span className={`w-16 h-16 rounded-full bg-amber-400 text-white grid place-items-center text-xl font-black shadow-lg border-4 border-white ${isAnimating === 'add' ? 'animate-pulse' : ''}`}>ИЛИ</span>
                        <span className="text-xs font-bold text-slate-500 text-center max-w-[7rem]">групите нямат общи ученици</span>
                      </div>

                      <div className="relative rounded-2xl overflow-hidden border-2 border-indigo-300 bg-gradient-to-b from-indigo-900 via-violet-700 to-fuchsia-600 p-4 pt-12 shadow-inner">
                        <div className="absolute inset-0 opacity-20 text-white text-3xl select-none pointer-events-none" aria-hidden="true" data-no3d="">
                          <span className="absolute left-3 top-10">♪</span><span className="absolute right-6 top-14">♫</span><span className="absolute left-1/3 bottom-6">♩</span><span className="absolute right-1/4 bottom-3">♬</span>
                        </div>
                        <div className="absolute top-2 left-1/2 -translate-x-1/2 bg-sky-200 text-indigo-900 font-black text-sm px-3 py-1 rounded-full shadow whitespace-nowrap">🎵 Училищен хор · {choirCount}</div>
                        <div className="flex flex-wrap justify-center gap-3 pt-2 relative">
                          {choirIds.map((id, i) => {
                            const on = exploredAlternatives.includes(id);
                            return (
                              <span key={id} className="inline-block animate-pop-in" style={{ animationDelay: `${(theaterCount + i) * 45}ms`, opacity: 0 }}>
                                <button data-alt={id} onClick={() => toggleAlternative(id)} aria-pressed={on} aria-label={`Ученик ${id} от хора`}

                {activeChallenge === 'summary' && solvedChallenges === 2 && (

              {activeChallenge === 'summary' && (

              <div className="mt-7 rounded-3xl border-2 border-dashed border-amber-300 bg-amber-50 p-5">

                  <button onClick={() => setCheckedRule('add')} className="rounded-2xl bg-white border border-blue-200 p-4 text-left hover:bg-blue-50">
                    <strong className="text-blue-800">Избирам A ИЛИ B</strong>
                    <span className="block text-sm text-gray-600 mt-1">Натисни, за да провериш правилото.</span>
                  </button>
                  <button onClick={() => setCheckedRule('multiply')} className="rounded-2xl bg-white border border-emerald-200 p-4 text-left hover:bg-emerald-50">
                    <strong className="text-emerald-800">Извършвам A И след това B</strong>

                    {checkedRule === 'add'
                      ? 'Правилно: при избор „A или B“ събираме броя на възможностите.'
                      : 'Правилно: при последователни стъпки „A и B“ умножаваме броя на възможностите.'}

                )}

              <div className="mt-7 rounded-2xl bg-slate-900 text-white p-5 text-center">

                <span className="ml-2">„ИЛИ“ насочва към събиране, а „И“ между последователни стъпки — към умножение.</span>
              </div>

        };

        const PermutationsLab = ({ onComplete }) => {
          const allItems = ['🍎', '🍓', '🍇'];
          const [availableItems, setAvailableItems] = useState(allItems);
          const [currentSelection, setCurrentSelection] = useState([]);
          const [foundSets, setFoundSets] = useState([]);
          const [message, setMessage] = useState('');
          const selectionAnimation = useSelectionAnimation(allItems, 3, setAvailableItems, setCurrentSelection);
          
          const targetCount = 6; 
          const isSolved = foundSets.length === targetCount;

          // --- Автоматично подреждане на всички възможности ---
          const rootRef = useRef(null);
          const foundRef = useRef(foundSets);
          const stopRef = useRef(false);
          const aliveRef = useRef(true);
          const [autoRunning, setAutoRunning] = useState(false);
          const [pending, setPending] = useState(false);
          const [speed, setSpeed] = useState('normal');
          const speedRef = useRef('normal');
          const autoTone = 'blue';
          useEffect(() => { foundRef.current = foundSets; }, [foundSets]);
          useEffect(() => { speedRef.current = speed; }, [speed]);
          useEffect(() => () => { aliveRef.current = false; stopRef.current = true; }, []);
          const keyOf = (a) => (true ? a : [...a].sort()).join('-');
          const slotFor = (st) => st;

          const autoArrange = async (continuous) => {
            stopRef.current = false;
            setAutoRunning(true);
            resetSelection();
            setMessage('');
            while (aliveRef.current) {
              const found = foundRef.current;
              const next = arrangementsOf(allItems, 3, true).find(a => !found.includes(keyOf(a)));
              if (!next) break;
              const ms = SPEEDS.find(x => x.id === speedRef.current).ms;
              for (let st = 0; st < next.length; st++) {
                const item = next[st];
                const root = rootRef.current;
                const from = root && root.querySelector(`[data-item="${item}"]`);
                const to = root && root.querySelector(`[data-slot="${slotFor(st)}"]`);
                await flyEmoji(from, to, item, ms);
                if (!aliveRef.current) return;
                const part = next.slice(0, st + 1);
                setCurrentSelection(part);
                setAvailableItems(allItems.filter(i => !part.includes(i)));
                await sleep(ms * 0.25);
              }
              await sleep(ms * 0.5);
              if (!aliveRef.current) return;
              const updated = [...foundRef.current, keyOf(next)];
              foundRef.current = updated;
              setFoundSets(updated);
              setMessage('Браво! Откри нова подредба.');
              if (updated.length === targetCount && onComplete) onComplete();
              await sleep(ms * 0.9);
              if (!aliveRef.current) return;
              setMessage('');
              resetSelection();
              await sleep(ms * 0.2);
              if (!continuous || stopRef.current) break;
            }
            if (aliveRef.current) setAutoRunning(false);
          };

          const clearAll = () => {
            stopRef.current = true;
            foundRef.current = [];
            setFoundSets([]);
            setMessage('');
            resetSelection();
          };


          const selectItem = (item) => {
            if (autoRunning || pending) return;
            if (currentSelection.length < 3) {
              setCurrentSelection([...currentSelection, item]);
              setAvailableItems(availableItems.filter(i => i !== item));
            }
          };

          const undoItem = (item) => {
            if (autoRunning || pending) return;
            setCurrentSelection(currentSelection.filter(i => i !== item));
            setAvailableItems([...availableItems, item].sort((a, b) => allItems.indexOf(a) - allItems.indexOf(b)));
          };

          const resetSelection = () => {
            selectionAnimation.resetAnimatedSelection();
          };

          const submitSelection = () => {
            if (currentSelection.length !== 3) return;
            setPending(true);
            
            const setStr = currentSelection.join('-');
            let newFoundSets = [...foundSets];

            if (newFoundSets.includes(setStr)) {
              setMessage('Вече намери тази подредба! Опитай друга.');
            } else {
              newFoundSets.push(setStr);
              setFoundSets(newFoundSets);
              setMessage('Браво! Откри нова подредба.');
              
              if (newFoundSets.length === targetCount && onComplete) {
                 onComplete();
              }
            }
            
            setTimeout(() => {
              setPending(false);
              setMessage('');
              resetSelection();
            }, 1500);
          };

          return (
            <div ref={rootRef} className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-t-4 border-blue-500 animate-slide-up">
              <h3 className="text-2xl font-extrabold text-blue-700 mb-4 transition-all">
                {isSolved ? 'Разкрито: Пермутации' : 'Първо предизвикателство: Подреди плодовете'}
              </h3>
              <p className="text-gray-600 mb-6 text-lg">
                Разполагаш с 3 различни плода (🍎, 🍓, 🍇). Имаш за задача да ги подредиш в редица.
                {!isSolved ? ' Намери всички възможни различни начини на подреждане, за да отключиш тайната на това математическо действие!' : ` Броят на всички възможни подредби е точно ${targetCount}.`}
              </p>

              <AutoControls running={autoRunning} onRun={() => autoArrange(true)} onStep={() => autoArrange(false)} onPause={() => { stopRef.current = true; }} onClear={clearAll} speed={speed} setSpeed={setSpeed} disabled={pending} solved={isSolved} tone={autoTone} />

              <div className="flex flex-col lg:flex-row gap-6 mb-8">
                <div className="flex-1 bg-gray-50 p-5 rounded-2xl border border-gray-200 shadow-inner">
                  <div className="mb-6">
                    <div className="text-sm font-bold mb-3 text-gray-500 uppercase tracking-wider">Свободни плодове:</div>
                    <div className="flex gap-3 min-h-[70px]">
                      {availableItems.map((item, idx) => (
                        <button key={item} data-item={item} onClick={() => selectItem(item)} aria-label={`Добави плод ${item} в редицата`} className="text-5xl bg-white p-3 rounded-xl shadow hover:scale-110 hover:-translate-y-1 transition-all">
                          {item}
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <div className="mb-6">
                    <div className="text-sm font-bold mb-3 text-gray-500 uppercase tracking-wider">Твоята редица:</div>
                    <div className="flex gap-3 bg-gray-200 p-3 rounded-2xl min-h-[90px] items-center">
                      {[0, 1, 2].map((slotIdx) => (
                        <div data-slot={slotIdx} key={slotIdx} className="w-16 h-16 border-2 border-dashed border-gray-400 bg-white/50 rounded-xl flex items-center justify-center">
                          {currentSelection[slotIdx] ? (
                            <button onClick={() => undoItem(currentSelection[slotIdx])} aria-label={`Премахни плод ${currentSelection[slotIdx]} от редицата`} className="text-5xl hover:scale-110 transition-transform">
                              {currentSelection[slotIdx]}
                            </button>
                          ) : null}
                        </div>
                      ))}
                    </div>
                  </div>

                  <button 
                    onClick={submitSelection}
                    disabled={currentSelection.length !== 3 || autoRunning || pending}
                    className={`w-full py-4 rounded-xl font-bold text-white transition-all text-lg shadow-md ${currentSelection.length === 3 ? 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg active:scale-95' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                  >
                    Запиши редицата
                  </button>
                  <div className="min-h-[24px] mt-3">
                     {message && <div className="text-center font-bold text-blue-600 animate-fade-in">{message}</div>}
                  </div>
                </div>

                <div className="flex-1 bg-blue-50/50 p-5 rounded-2xl border border-blue-100">
                  <div className="flex justify-between items-center mb-4">
                    <h4 className="font-bold text-blue-900 text-lg">Намерени: {foundSets.length} / {targetCount}</h4>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {foundSets.map((set, idx) => (
                      <div key={idx} className="bg-white p-3 rounded-xl shadow-sm text-center text-3xl flex justify-center gap-1 border border-blue-50 animate-pop-in">
                        {set.split('-').map((item, i) => <span key={i}>{item}</span>)}
                      </div>
                    ))}
                    {Array.from({ length: targetCount - foundSets.length }).map((_, idx) => (
                      <div key={`empty-${idx}`} className="bg-gray-100/50 p-3 rounded-xl text-center text-xl text-gray-400 border-2 border-dashed border-gray-200 flex items-center justify-center h-[62px]">
                        ?
                      </div>
                    ))}
                  </div>
                  {isSolved && (
                    <div className="mt-6 p-4 bg-green-100 text-green-800 rounded-xl text-center font-bold text-lg flex items-center justify-center gap-2 animate-fade-in">
                      <Trophy size={24} /> Мисията изпълнена!
                    </div>
                  )}
                </div>
              </div>

              answer = factoriel(n);
              const scenarios = [
                <>По колко различни начина могат да се подредят <MathFormula tex={n.toString()} /> различни книги на един рафт?</>,
                <><MathFormula tex={n.toString()} /> ученици трябва да се подредят в редица за снимка. Колко са възможните подредби?</>,
                <>Имаме <MathFormula tex={n.toString()} /> различни картини. По колко начина можем да ги закачим една до друга на стената?</>,
                <>В състезание участват <MathFormula tex={n.toString()} /> бегачи. По колко различни начина може да изглежда крайното класиране?</>,
                <>Колко различни думи (дори и без смисъл) могат да се съставят чрез разместване на буквите на дума с <MathFormula tex={n.toString()} /> различни букви?</>
              ];
              qText = scenarios[randomInt(0, scenarios.length - 1)];
              options = [answer, factoriel(n-1), answer * 2, n * n];
            } 
            else if (type === 2) { // ВАРИАЦИИ
              n = randomInt(6, 11);
              k = randomInt(2, 3);
              answer = calcV(n, k);
              
              const scenarios = [
                 <>От клас с <MathFormula tex={n.toString()} /> ученици трябва да се изберат председател и секретар. По колко начина може да стане това?</>,
                 <>На турнир участват <MathFormula tex={n.toString()} /> отбора. По колко начина могат да се разпределят златните и сребърните медали?</>,
                 <>Колко различни <MathFormula tex={k.toString()} />-цифрени числа могат да се образуват от <MathFormula tex={n.toString()} /> различни цифри (без нула), ако не се повтарят?</>,
                 <>Дадени са <MathFormula tex={`n=${n}, k=${k}`} />. Редът ИМА значение. Изчисли <MathFormula tex={`V_{${n}}^{${k}}`} />.</>
              ];
              
              if (k === 3) {
                  scenarios[0] = <>От <MathFormula tex={n.toString()} /> кандидати трябва да се изберат управител, счетоводител и касиер. По колко начина?</>;
                  scenarios[1] = <>На турнир участват <MathFormula tex={n.toString()} /> отбора. По колко начина могат да се разпределят златен, сребърен и бронзов медал?</>;
              }

              qText = scenarios[randomInt(0, scenarios.length - 1)];
              options = [answer, calcC(n,k), answer * 2, Math.pow(n, k)];
            } 
            else { // КОМБИНАЦИИ
              n = randomInt(6, 14);
              k = randomInt(2, 4);
              answer = calcC(n, k);
              
              const scenarios = [
                 <>От група от <MathFormula tex={n.toString()} /> приятели трябва да се изберат <MathFormula tex={k.toString()} /> за отбор. По колко начина може да стане това?</>,
                 <>В кутия има <MathFormula tex={n.toString()} /> различни бонбона. По колко начина можеш да си избереш точно <MathFormula tex={k.toString()} /> от тях?</>,
                 <>За училищен проект от <MathFormula tex={n.toString()} /> ученици се избира група от <MathFormula tex={k.toString()} /> дежурни. Колко са възможните групи?</>,
                 <>Дадени са <MathFormula tex={`n=${n}, k=${k}`} />. Редът НЯМА значение. Изчисли <MathFormula tex={`C_{${n}}^{${k}}`} />.</>,
                 <>От <MathFormula tex={n.toString()} /> налични цвята трябва да изберем <MathFormula tex={k.toString()} /> за направата на букет. По колко начина може да стане това?</>
              ];

              qText = scenarios[randomInt(0, scenarios.length - 1)];
              options = [answer, calcV(n,k), answer * k, answer + n];
            }

            // Премахваме дублиращи се грешни отговори и попълваме до 4 опции
            options = options.filter((v, idx, arr) => arr.indexOf(v) === idx && v > 0);
            while(options.length < 4) {
                let fakeOpt = answer + randomInt(-5, 15);
                if(fakeOpt === answer) fakeOpt += randomInt(1, 5); // избягваме дублиране на верния
                if (!options.includes(fakeOpt) && fakeOpt > 0) options.push(fakeOpt);
            }
            
            // Разбъркваме 4-те отговора за да не са на едно и също място
            for (let j = options.length - 1; j > 0; j--) {
                const randIdx = Math.floor(Math.random() * (j + 1));
                [options[j], options[randIdx]] = [options[randIdx], options[j]];
            }

            questions.push({ id: i, text: qText, options: options, correctAnswer: answer, type, n, k: type === 1 ? n : k });
          }
          return questions;
        };

        const QuizSimulation = ({ question }) => {
          const [selected, setSelected] = useState([]);
          const [isAnimating, setIsAnimating] = useState(false);
          const { schedule, clearAnimation } = useTimedAnimation();
          const needed = question.type === 1 ? question.n : question.k;
          const orderMatters = question.type !== 3;

          useEffect(() => {
            clearAnimation();
            setSelected([]);
            setIsAnimating(false);
          }, [question.id]);

          const resetSimulation = () => {
            clearAnimation();
            setSelected([]);
            setIsAnimating(false);
          };
          const animateSimulation = () => {
            resetSimulation();
            setIsAnimating(true);
            Array.from({length:needed},(_,index)=>index+1).forEach((item, index) => {
              schedule(() => setSelected(previous => [...previous, item]), index * 650);
            });
            schedule(() => setIsAnimating(false), needed * 650 + 150);
          };

          const toggle = (item) => {
            if (selected.includes(item)) {
              setSelected(selected.filter(value => value !== item));
            } else if (selected.length < needed) {
              setSelected([...selected, item]);
            }
          };

          const displayedSelection = orderMatters ? selected : [...selected].sort((a,b)=>a-b);

          return (
            <div className="mb-7 rounded-2xl border border-indigo-200 bg-indigo-50 p-5">
              <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                <strong className="text-indigo-900">Симулация към въпроса</strong>
                <span className="text-sm font-bold text-indigo-700">
                  {orderMatters ? 'Редът се запазва' : 'Редът не променя групата'}
                </span>
              </div>
              <div className="flex flex-wrap gap-2 mb-4">
                {Array.from({length:question.n},(_,index)=>index+1).map(item => (
                  <button key={item} onClick={() => toggle(item)} aria-pressed={selected.includes(item)}
                    className={`w-11 h-11 rounded-xl font-extrabold ${selected.includes(item) ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-900 border border-indigo-200'}`}>
                    {item}
                  </button>
                ))}
              </div>
              <div className="flex flex-wrap items-center gap-2 min-h-[48px]">
                <span className="text-sm font-bold text-gray-500 mr-2">{question.type === 1 ? 'Подредба:' : question.type === 2 ? 'Избрани позиции:' : 'Група:'}</span>
                {Array.from({length:needed},(_,index) => (
                  <span key={index} className="w-11 h-11 rounded-xl bg-white border-2 border-dashed border-indigo-300 grid place-items-center font-bold text-indigo-900">
                    {displayedSelection[index] || '—'}
                  </span>
                ))}
              </div>
              <SimulationControls onPlay={animateSimulation} onReset={resetSimulation}
                isAnimating={isAnimating} label="Попълни модела стъпка по стъпка" />
            </div>
          );
        };

        const Quiz = () => {
          const [questions, setQuestions] = useState([]);
          const [currentQIndex, setCurrentQIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [showResults, setShowResults] = useState(false);
          const [selectedAnswer, setSelectedAnswer] = useState(null);

          useEffect(() => {
            setQuestions(generateQuestions());
          }, []);

          const handleAnswer = (answer) => {
            setSelectedAnswer(answer);
            
            setTimeout(() => {
              if (answer === questions[currentQIndex].correctAnswer) {
                setScore(score + 1);
              }
              
              if (currentQIndex < questions.length - 1) {
                setCurrentQIndex(currentQIndex + 1);
                setSelectedAnswer(null);
              } else {
                setShowResults(true);
              }
            }, 1000);
          };

          const restartQuiz = () => {
            setQuestions(generateQuestions());
            setCurrentQIndex(0);
            setScore(0);
            setShowResults(false);
            setSelectedAnswer(null);
          };

          if (questions.length === 0) return <div>Зареждане...</div>;

          return (
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-t-4 border-indigo-500 animate-fade-in flex flex-col min-h-[500px]">
              <div className="flex justify-between items-center mb-6 border-b pb-4">
                <h3 className="text-2xl font-extrabold text-indigo-700">Финален Тест</h3>
                {!showResults && (
                   <span className="bg-indigo-100 text-indigo-800 px-4 py-1 rounded-full font-bold text-sm">
                     Въпрос {currentQIndex + 1} от 10
                   </span>
                )}
              </div>

              {!showResults ? (
                <div className="flex-1 flex flex-col">
                  <div className="mb-8 text-xl font-medium text-gray-800 bg-gray-50 p-6 rounded-2xl flex flex-wrap gap-1 items-center leading-relaxed">
                    {questions[currentQIndex].text}
                  </div>
                  <QuizSimulation question={questions[currentQIndex]} />
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                    {questions[currentQIndex].options.map((opt, idx) => {
                      let btnClass = "bg-white border-2 border-indigo-100 hover:border-indigo-500 hover:bg-indigo-50 text-indigo-900";
                      if (selectedAnswer !== null) {
                        if (opt === questions[currentQIndex].correctAnswer) btnClass = "bg-green-500 border-green-600 text-white shadow-lg scale-105";
                        else if (opt === selectedAnswer) btnClass = "bg-red-500 border-red-600 text-white";
                        else btnClass = "bg-gray-100 border-gray-200 text-gray-400 opacity-50";
                      }

                      return (
                        <button 
                          key={idx}
                          disabled={selectedAnswer !== null}
                          onClick={() => handleAnswer(opt)}
                          className={`p-4 rounded-xl text-lg font-bold transition-all duration-300 ${btnClass}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center text-center animate-pop-in">
                  <Trophy size={64} className={`mb-4 ${score > 7 ? 'text-yellow-400' : 'text-gray-400'}`} />
                  <h4 className="text-3xl font-bold text-gray-800 mb-2">Резултат: {score} от 10</h4>
                  <p className="text-lg text-gray-600 mb-8">
                    {score >= 9 ? 'Брилянтно! Истински майстор на комбинаториката!' : 
                     score >= 5 ? 'Добър опит! Имаш стабилни основи.' : 
                     'Може би трябва да преговориш теорията отново.'}
                  </p>
                  <button 
                    onClick={restartQuiz}
                    className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-full font-bold text-lg transition-all shadow-md hover:shadow-lg"
                  >
                    <RefreshCw size={20} /> Нов тест (Нови задачи)
                  </button>
                </div>
              )}
            </div>
          );
        };

          const [rulesSolved, setRulesSolved] = useState(false);

                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div>
                  <h1 className="text-2xl font-extrabold text-gray-900 tracking-tight leading-tight">
                    {lessonPath === 'rules'
                      ? (rulesSolved ? 'Събиране и умножение на възможности' : 'Урок 1 · Открий правилата')
                      : (modelsSolved ? 'Пермутации, вариации и комбинации' : 'Урок 2 · Открий моделите')}
                  </h1>
                  <h2 className="text-sm text-gray-500 font-medium hidden sm:block">
                    {lessonPath === 'rules' ? 'Урок 1 · Основни правила за броене' : 'Урок 2 · Основни комбинаторни модели'}
                  </h2>
                </div>
              </header>

              <div className="max-w-6xl w-full mx-auto px-4 mt-6 flex-1 flex flex-col relative z-10">
                {lessonPath === 'rules' ? (
                  <div className="flex items-center justify-between gap-4 bg-amber-50 rounded-2xl shadow-sm p-4 mb-6 border border-amber-200">
                    <div>
                      <strong className="text-amber-900">Урок 1</strong>
                      <span className="block text-sm text-amber-800">Две предизвикателства и обобщение</span>
                    </div>
                    <button onClick={() => { setLessonPath('models'); setActiveTab('permutations'); window.scrollTo({top:0,behavior:'smooth'}); }}
                      className="rounded-xl bg-blue-600 text-white px-5 py-3 font-bold whitespace-nowrap">
                      Към урок 2 →
                    </button>
                  </div>
                ) : (
                <div className="flex bg-white rounded-2xl shadow-sm p-1.5 gap-2 mb-6 overflow-x-auto border border-gray-200 shrink-0 hide-scrollbar">
                  <button 
                    onClick={() => setActiveTab('permutations')}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm sm:text-base transition-all whitespace-nowrap flex items-center justify-center gap-2 ${activeTab === 'permutations' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}
                  >
                    {solvedLevels.permutations ? <CheckCircle size={18} /> : <span className="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>}
                    {solvedLevels.permutations ? 'Пермутации' : 'Предизвикателство'}
                  </button>
                  
                  <button
