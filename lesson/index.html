                    onClick={() => solvedLevels.permutations && setActiveTab('variations')}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm sm:text-base transition-all whitespace-nowrap flex items-center justify-center gap-2 ${activeTab === 'variations' ? 'bg-emerald-600 text-white shadow-md' : solvedLevels.permutations ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed'}`}
                  >
                    {solvedLevels.variations ? <CheckCircle size={18} /> : <span className="bg-emerald-100 text-emerald-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>}
                    {solvedLevels.variations ? 'Вариации' : solvedLevels.permutations ? 'Предизвикателство' : 'Заключено'}
                  </button>
                  
                  <button 
                    disabled={!solvedLevels.variations}
                    onClick={() => solvedLevels.variations && setActiveTab('combinations')}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm sm:text-base transition-all whitespace-nowrap flex items-center justify-center gap-2 ${activeTab === 'combinations' ? 'bg-purple-600 text-white shadow-md' : solvedLevels.variations ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed'}`}
                  >
                     {solvedLevels.combinations ? <CheckCircle size={18} /> : <span className="bg-purple-100 text-purple-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>}
                    {solvedLevels.combinations ? 'Комбинации' : solvedLevels.variations ? 'Предизвикателство' : 'Заключено'}
                  </button>

                  <button 
                    disabled={!modelsSolved}
                    onClick={() => modelsSolved && setActiveTab('summary')}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm sm:text-base transition-all whitespace-nowrap flex items-center justify-center gap-2 ${activeTab === 'summary' ? 'bg-amber-500 text-white shadow-md' : modelsSolved ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed'}`}
                  >
                     <span className="bg-amber-100 text-amber-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">4</span>
                     {modelsSolved ? 'Обобщение' : 'Заключено'}
                  </button>

                  <button 
                    disabled={!modelsSolved}
                    onClick={() => modelsSolved && setActiveTab('quiz')}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm sm:text-base transition-all whitespace-nowrap flex items-center justify-center gap-2 ${activeTab === 'quiz' ? 'bg-indigo-600 text-white shadow-md' : modelsSolved ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed'}`}
                  >
                     <span className="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-xs">5</span>
                     {modelsSolved ? 'Тест' : 'Заключено'}
                  </button>
                </div>
                )}

                <main className="mb-12 flex-1 relative">
                  {activeTab === 'rules' && <CountingRules onComplete={() => setRulesSolved(true)} onNext={() => { setLessonPath('models'); setActiveTab('permutations'); window.scrollTo({top:0,behavior:'smooth'}); }} />}
                  {activeTab === 'permutations' && <PermutationsLab onComplete={() => setSolvedLevels(prev => ({...prev, permutations: true}))} />}
                  {activeTab === 'variations' && <VariationsLab onComplete={() => setSolvedLevels(prev => ({...prev, variations: true}))} />}
                  {activeTab === 'combinations' && <CombinationsLab onComplete={() => setSolvedLevels(prev => ({...prev, combinations: true}))} />}
                  {activeTab === 'summary' && (
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-t-4 border-amber-500 animate-fade-in relative z-10">
                      <h3 className="text-3xl font-extrabold text-amber-600 mb-6 flex items-center gap-3">
                        Обобщение: Как да решаваме задачи?
                      </h3>
                      <p className="text-gray-700 text-lg mb-8">
                        Преди да преминеш към теста, нека преговорим! Най-важното в комбинаториката е да си зададеш правилните въпроси, за да разбереш коя формула ти трябва.
                      </p>

                      <div className="grid sm:grid-cols-2 gap-4 mb-8">
                        <div className="rounded-2xl bg-blue-50 border border-blue-200 p-5">
                          <h4 className="font-extrabold text-blue-900 text-xl mb-2">A ИЛИ B → събиране</h4>
                          <p className="text-gray-700">При непресичащи се алтернативни избори общият брой е <MathFormula tex="m+n" />.</p>
                        </div>
                        <div className="rounded-2xl bg-emerald-50 border border-emerald-200 p-5">
                          <h4 className="font-extrabold text-emerald-900 text-xl mb-2">A И B → умножение</h4>
                          <p className="text-gray-700">При последователни стъпки общият брой е <MathFormula tex="m \cdot n" />.</p>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-6 mb-8">
                        
                        {/* Пермутации */}
                        <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100 shadow-sm hover:shadow-md transition-shadow">
                          <h4 className="text-xl font-bold text-blue-800 border-b border-blue-200 pb-2 mb-4 flex items-center gap-2">
                            1. Пермутации (<MathFormula tex="P_n" />)
                          </h4>
                          <ul className="space-y-3 mb-6">
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-blue-500 mt-0.5">Въпрос:</span>
                              <span className="text-gray-700">Използваме ли <strong>ВСИЧКИ</strong> дадени елементи?</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-green-600 mt-0.5">Отговор:</span>
                              <span className="text-gray-700"><strong>ДА.</strong> Просто ги подреждаме (разбъркваме).</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-blue-500 mt-0.5">Ред:</span>
                              <span className="text-gray-700">Има значение.</span>
                            </li>
                          </ul>
                          <div className="bg-white p-3 rounded-xl text-center text-blue-900 border border-blue-100">
                            <MathFormula tex="P_n = n!" display={true} />
                          </div>
                          <p className="text-sm text-gray-500 mt-3 italic">Напр: По колко начина можем да подредим 5 книги на един рафт?</p>
                        </div>

                        {/* Вариации */}
                        <div className="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 shadow-sm hover:shadow-md transition-shadow">
                          <h4 className="text-xl font-bold text-emerald-800 border-b border-emerald-200 pb-2 mb-4 flex items-center gap-2">
                            2. Вариации (<MathFormula tex="V_n^k" />)
                          </h4>
                          <ul className="space-y-3 mb-6">
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-emerald-500 mt-0.5">Въпрос:</span>
                              <span className="text-gray-700">Избираме ли само <strong>ЧАСТ</strong> от елементите?</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-green-600 mt-0.5">Отговор:</span>
                              <span className="text-gray-700"><strong>ДА.</strong> Избираме <span className="italic"><MathFormula tex="k" /></span> от <span className="italic"><MathFormula tex="n" /></span>.</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-emerald-500 mt-0.5">Ред:</span>
                              <span className="text-gray-700"><strong>ИМА</strong> значение! (АБ ≠ БА)</span>
                            </li>
                          </ul>
                          <div className="bg-white p-3 rounded-xl text-center text-emerald-900 border border-emerald-100">
                            <MathFormula tex="V_n^k = \frac{n!}{(n-k)!}" display={true} />
                          </div>
                          <p className="text-sm text-gray-500 mt-3 italic">Напр: Избор на председател и секретар от клас с 20 ученици.</p>
                        </div>

                        {/* Комбинации */}
                        <div className="bg-purple-50 p-6 rounded-2xl border border-purple-100 shadow-sm hover:shadow-md transition-shadow">
                          <h4 className="text-xl font-bold text-purple-800 border-b border-purple-200 pb-2 mb-4 flex items-center gap-2">

                          </h4>
                          <ul className="space-y-3 mb-6">
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-purple-500 mt-0.5">Въпрос:</span>

                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-green-600 mt-0.5">Отговор:</span>

                            </li>
                            <li className="flex items-start gap-2">
                              <span className="font-bold text-purple-500 mt-0.5">Ред:</span>
                              <span className="text-gray-700"><strong>НЯМА</strong> значение! (АБ = БА)</span>
                            </li>
                          </ul>
                          <div className="bg-white p-3 rounded-xl text-center text-purple-900 border border-purple-100">
                            <MathFormula tex="C_n^k = \frac{V_n^k}{P_k}" display={true} />
                          </div>
                          <p className="text-sm text-gray-500 mt-3 italic">Напр: Избор на двама дежурни от клас с 20 ученици.</p>
                        </div>

                      </div>
                      
                      <div className="flex justify-center mt-2 border-t border-amber-100 pt-8 pb-4">
                        <button 
                          onClick={() => setActiveTab('quiz')}
                          className="group relative inline-flex items-center justify-center px-10 py-4 font-bold text-white transition-all duration-200 bg-indigo-600 rounded-xl hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600 text-xl shadow-lg hover:shadow-xl hover:-translate-y-1 animate-pop-in"
                        >
                          Премини към Теста
                          <ArrowRight className="ml-3 group-hover:translate-x-2 transition-transform" />
                        </button>
                      </div>

                    </div>
                  )}
                  {activeTab === 'quiz' && <Quiz />}
                </main>
              </div>
              
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
